// Standalone optional runtime lane. Adapted from reference at 0e6094bf (MIT).
plugins { id 'groovy' }

repositories {
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.joelwetzel' }
        metadataSources { mavenPom() }
    }
}

def repoRoot = projectDir.parentFile.parentFile

dependencies {
    testImplementation 'org.codehaus.groovy:groovy-all:2.5.23'
    testImplementation 'org.spockframework:spock-core:2.5-groovy-2.5'
    testImplementation 'com.github.joelwetzel:hubitat_ci:2de1d3dfdcd15f90f9603b122ef9a31028f2b88b'
    testImplementation 'org.codehaus.groovy.modules.http-builder:http-builder:0.7.1'
    testImplementation 'org.quartz-scheduler:quartz:2.5.2'
    testImplementation 'su.litvak.chromecast:api-v2:0.11.1'
    testImplementation 'net.bytebuddy:byte-buddy:1.18.15'
    constraints {
        testImplementation('commons-collections:commons-collections:3.2.2') {
            because 'Patched version of the test-only http-builder transitive dependency'
        }
    }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(11) } }
sourceSets {
    test {
        groovy { srcDirs = [new File(repoRoot, 'src/test/groovy')] }
        resources { srcDirs = [new File(repoRoot, 'src/test/resources')] }
    }
}

test {
    useJUnitPlatform()
    workingDir = repoRoot
    maxParallelForks = 1
    systemProperty 'hubitatCiFork', 'joelwetzel'
    // Groovy 2.5's reflective access under JDK 11 (copied from the reference lane).
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.math=ALL-UNNAMED',
            '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.base/java.time=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.regex=ALL-UNNAMED',
            '--add-opens=java.base/sun.util.calendar=ALL-UNNAMED',
            '--add-opens=java.xml/com.sun.org.apache.xerces.internal.dom=ALL-UNNAMED'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}
