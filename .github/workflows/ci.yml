name: Toolkit CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check immutable extraction
        run: python3 tools/verify_reference.py
      - name: Packaging contracts
        run: python3 -m unittest discover -s toolkit-tests -v
      - name: E2E scaffold offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Build example bundle
        run: |
          python3 tools/build_bundle.py
          cd dist
          sha256sum hubitat-bundle.zip > hubitat-bundle.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: example-bundle
          path: dist/
  groovy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [primary, groovy25, parse24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Primary Groovy 3 Spock tests
        if: matrix.lane == 'primary'
        run: ./gradlew test --no-daemon
      - name: Groovy 2.5 compatibility
        if: matrix.lane == 'groovy25'
        run: ./gradlew -p ci/groovy2x-spock test --no-daemon
      - name: Groovy 2.4 syntax and sandbox gate
        if: matrix.lane == 'parse24'
        run: ./gradlew -p ci/groovy24-parse parse24 --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: groovy-${{ matrix.lane }}-reports
          if-no-files-found: ignore
          path: |
            build/reports/
            ci/*/build/reports/
  watchdog-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Watchdog v3.1 regression suite
        run: ./gradlew watchdogTest --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: watchdog-v31-reports
          path: |
            build/reports/tests/watchdogTest/
            build/test-results/watchdogTest/
  reference-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reference/hubitat-local-mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Original lease and lane-gate regression suites
        run: |
          bash tests/lease_scripts_test.sh
          node tests/lane_gate_test.js
      - name: Shell syntax
        working-directory: .
        run: |
          bash -n scripts/lease_acquire.sh
          bash -n scripts/lease_release.sh

  toolkit-ci:
    name: Toolkit CI required
    if: always()
    needs: [python-and-packaging, groovy, watchdog-v31, reference-infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every offline lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required lanes did not succeed: {failed}')
          print('All offline lanes passed.')
          PYCODE
